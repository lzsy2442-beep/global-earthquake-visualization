name: 每日同步最新地震

on:
  schedule:
    # UTC 01:17 = 北京时间 09:17，避开整点高峰
    - cron: "17 1 * * *"
  workflow_dispatch: {}

# 需要写权限把数据文件提交回仓库，提交后 Cloudflare 会自动重新部署
permissions:
  contents: write

concurrency:
  group: daily-earthquake
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并合并 USGS 最新数据
        run: python scripts/fetch_recent.py

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "data: 每日同步最新地震 $(date -u +%Y-%m-%d)"
            git push
          fi
