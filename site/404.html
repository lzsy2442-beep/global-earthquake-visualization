<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · 页面不存在 | 全球地震可视化</title>
<style>
  :root{--navy:#0e2a47;--teal:#1798a8;--bg:#edf1f6;--muted:#5d7186;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
    background:radial-gradient(circle at 50% 0%,#143a5e 0%,#0b2440 60%);
    color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .code{font-size:clamp(64px,14vw,120px);font-weight:900;line-height:1;
    background:linear-gradient(145deg,#5fd0dc,#1798a8);-webkit-background-clip:text;background-clip:text;color:transparent;}
  h1{font-size:20px;margin:14px 0 8px;font-weight:800;}
  p{color:#9fbdd6;font-size:14px;margin:0 0 26px;}
  a{display:inline-block;padding:10px 22px;border-radius:10px;text-decoration:none;color:#0b2440;
    background:linear-gradient(145deg,#5fd0dc,#1798a8);font-weight:700;font-size:14px;}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>这条测线没有记录</h1>
    <p>页面不存在，或者链接已经失效。</p>
    <a href="/">回到首页</a>
  </div>
</body>
</html>
